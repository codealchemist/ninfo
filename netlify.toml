[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing (react-router) — any path that isn't a real file falls
# through to index.html so /app/today, /app/macros, etc. work on direct load/refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# WebMCP (AI agents in the browser calling the app's tools — see src/webmcp) needs an
# origin-isolated document. Sent explicitly so a later change can't silently disable it.
[[headers]]
  for = "/*"
  [headers.values]
    Origin-Agent-Cluster = "?1"
    Permissions-Policy = "tools=(self)"
